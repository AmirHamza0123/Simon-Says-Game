<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simon game</title>
    <link rel="styleSheet" href="simonGame.css">
</head>
<body>
    <h1>Simon Says Game</h1>
    <h2>Press Any Key To Start The Game</h2>
    <div class="mainBox">

        <div id="lineOne">
            <div class="btn red" id="red" type="button"></div>
            <div class="btn yellow" id="yellow" type="button"></div>
        </div>

        <div id="lineTwo">
            <div class="btn green" id="green" type="button"></div>
            <div class="btn purple" id="purple" type="button"></div></div>
        </div>
    <script src="simonGame.js"></script>
</body>
</html>
